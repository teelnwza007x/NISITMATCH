<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12101d" />
  <meta name="color-scheme" content="dark" />
  <style>
    html,body{margin:0;min-height:100%;background:#12101d;color:#fff}
    #root{min-height:100vh;min-height:100dvh;background:#12101d}
    #nm-first-paint{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 70% 45% at 50% 42%,#392039 0%,#20162e 48%,#12101d 100%);color:#fff;z-index:0;font-family:system-ui,-apple-system,sans-serif}
    #nm-first-paint::before{content:"";position:absolute;width:min(78vw,350px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(246,94,163,.21),rgba(146,83,229,.08) 48%,transparent 72%);filter:blur(16px);animation:nm-ambient 3s ease-in-out infinite alternate;pointer-events:none}
    .nm-first-content{position:relative;display:flex;flex-direction:column;align-items:center;gap:17px;padding:24px;text-align:center}
    .nm-first-emblem{display:grid;place-items:center;width:82px;height:82px;border:1px solid rgba(255,255,255,.23);border-radius:26px;background:linear-gradient(145deg,#fb79b3,#aa72e8);box-shadow:0 12px 42px rgba(237,89,165,.25),inset 0 1px rgba(255,255,255,.28);transform:rotate(-7deg);animation:nm-appear .55s ease-out both}
    .nm-first-emblem svg{width:45px;height:45px;fill:#fff;filter:drop-shadow(0 3px 5px rgba(91,35,101,.2))}
    .nm-first-name{margin:4px 0 0;font-size:clamp(27px,7vw,35px);font-weight:800;line-height:1.15;letter-spacing:.11em;text-shadow:0 3px 22px rgba(246,112,184,.24);animation:nm-appear .6s .07s ease-out both}
    .nm-first-name span{background:linear-gradient(95deg,#ffb2d3,#f4a4d9 45%,#d6b5ff);color:transparent;-webkit-background-clip:text;background-clip:text}
    .nm-first-tagline{font-size:13px;letter-spacing:.045em;color:#c9b9d4;animation:nm-appear .6s .12s ease-out both}
    .nm-first-progress{height:3px;width:92px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.12);margin-top:15px;animation:nm-appear .6s .16s ease-out both}
    .nm-first-progress::after{content:"";display:block;height:100%;width:42%;border-radius:inherit;background:linear-gradient(90deg,#fa84bb,#b38af3);animation:nm-progress 1.1s ease-in-out infinite alternate}
    #root:not(:empty)+#nm-first-paint{display:none}
    @keyframes nm-appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes nm-ambient{to{transform:scale(1.15);opacity:.65}}
    @keyframes nm-progress{to{transform:translateX(140%)}}
    @media(prefers-reduced-motion:reduce){#nm-first-paint *,#nm-first-paint::before,#nm-first-paint *::after{animation:none!important}}
  </style>
  <meta name="description" content="NISIT MATCH พื้นที่ทำความรู้จักและค้นหา Match สำหรับนิสิตนักศึกษาไทย" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NISIT MATCH" />
  <meta name="application-name" content="NISIT MATCH" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>NISIT MATCH — เจอคนที่ใช่</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body><div id="root"></div><div id="nm-first-paint" aria-hidden="true"><div class="nm-first-content"><div class="nm-first-emblem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.1 3.7 13.4C-1.1 8.9 5.7 1.5 11.3 6.5l.7.6.7-.6c5.6-5 12.4 2.4 7.6 6.9L12 21.1Z"/></svg></div><div class="nm-first-name">NISIT <span>MATCH</span></div><div class="nm-first-tagline">พื้นที่ของการพบกันที่ใช่</div><div class="nm-first-progress"></div></div></div><script type="module" src="/src/main.jsx"></script></body>
</html>
