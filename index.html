<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12101d" />
  <meta name="color-scheme" content="dark" />
  <style>
html,body{margin:0;min-height:100%;background:#110e1b;color:#fff}
#root{min-height:100vh;min-height:100dvh;background:#110e1b}
#nm-first-paint{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:1;visibility:visible;transition:opacity .38s ease,visibility .38s ease;background:radial-gradient(ellipse 72% 40% at 50% 49%,rgba(130,48,105,.34) 0%,rgba(76,31,81,.18) 44%,transparent 100%),#110e1b;font-family:Kanit,system-ui,sans-serif}
#nm-first-paint .nm-boot-center{display:flex;flex-direction:column;align-items:center;width:100%;transform:translateY(-3%);padding:24px;box-sizing:border-box}
#nm-first-paint .nm-boot-logo-wrap{position:relative;width:120px;height:120px;filter:drop-shadow(0 15px 42px rgba(255,68,150,.22))}
#nm-first-paint .nm-boot-logo{display:block;width:100%;height:100%;object-fit:contain;border-radius:28px}
#nm-first-paint .nm-boot-sparkle{position:absolute;right:-18px;top:1px;font-size:22px;color:#f5c4e6;animation:nm-boot-twinkle 2.2s ease-in-out infinite}
#nm-first-paint .nm-boot-title{margin:32px 0 0;font-family:Inter,Kanit,system-ui,sans-serif;font-weight:800;font-size:clamp(30px,8vw,48px);letter-spacing:.035em;line-height:1.2;white-space:nowrap;color:#fff}
#nm-first-paint .nm-boot-title strong{font-weight:800;background:linear-gradient(100deg,#ff91b7,#ce94f7);-webkit-background-clip:text;background-clip:text;color:transparent}
#nm-first-paint .nm-boot-tagline{margin:24px 0 0;color:#d7c2d6;font-size:clamp(15px,4.4vw,20px);font-weight:400;letter-spacing:.01em}
#nm-first-paint .nm-boot-track{margin-top:46px;width:120px;height:4px;border-radius:99px;background:#3d304b;overflow:hidden}
#nm-first-paint .nm-boot-progress{display:block;width:43%;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff78b3,#a779ef);animation:nm-boot-progress 1.4s ease-in-out infinite alternate}
#nm-first-paint.nm-boot-done{opacity:0;visibility:hidden;pointer-events:none}
@keyframes nm-boot-progress{from{transform:translateX(-100%)}to{transform:translateX(230%)}}
@keyframes nm-boot-twinkle{0%,100%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
@media(prefers-reduced-motion:reduce){#nm-first-paint .nm-boot-progress,#nm-first-paint .nm-boot-sparkle{animation:none}}
</style>
  <meta name="description" content="NISIT MATCH พื้นที่ทำความรู้จักและค้นหา Match สำหรับนิสิตนักศึกษาไทย" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NISIT MATCH" />
  <meta name="application-name" content="NISIT MATCH" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>NISIT MATCH — เจอคนที่ใช่</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body><div id="root"></div><div id="nm-first-paint" aria-hidden="true"><div class="nm-boot-center"><div class="nm-boot-logo-wrap"><img class="nm-boot-logo" src="/nisit-match-logo.png" alt="" /><span class="nm-boot-sparkle">✦</span></div><div class="nm-boot-title">NISIT <strong>MATCH</strong></div><p class="nm-boot-tagline">เจอคนใหม่ ๆ ที่เข้าใจกัน</p><div class="nm-boot-track"><span class="nm-boot-progress"></span></div></div></div><script type="module" src="/src/main.jsx"></script><script>(function(){var splash=document.getElementById("nm-first-paint"),root=document.getElementById("root");function finish(){if(root&&root.childElementCount>0){splash.classList.add("nm-boot-done");setTimeout(function(){splash.remove()},450)}else{var obs=new MutationObserver(function(){if(root.childElementCount>0){obs.disconnect();finish()}});obs.observe(root,{childList:true})}}setTimeout(finish,2000)})();</script></body>
</html>
