<!doctype html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script>
    (() => {
      const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      if (!standalone) return;
      const syncFullScreenHeight = () => {
        const viewport = Math.max(window.innerHeight || 0, window.visualViewport?.height || 0);
        const screenHeight = Math.max(window.screen?.height || 0, viewport);
        if (screenHeight > 0) document.documentElement.style.setProperty('--nm-standalone-screen-height', screenHeight + 'px');
      };
      syncFullScreenHeight();
      window.addEventListener('orientationchange', syncFullScreenHeight, { passive: true });
      window.addEventListener('resize', syncFullScreenHeight, { passive: true });
    })();
  </script>

  <style>
html,body{margin:0;min-height:100%;background:#0c0714;color:#fff}
#root{min-height:100vh;min-height:100dvh;background:#110e1b}
#nm-first-paint{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;isolation:isolate;opacity:1;visibility:visible;transition:opacity .35s ease,visibility .35s ease;background:radial-gradient(ellipse 85% 54% at 50% 52%,#42112f 0%,#1a0a23 48%,#0b0713 100%);font-family:Kanit,system-ui,sans-serif}
#nm-first-paint:before{content:"";position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(circle at 25% 26%,#f7258533,transparent 24%),radial-gradient(circle at 78% 72%,#b73dff26,transparent 28%);animation:nm-boot-ambient 7s ease-in-out infinite alternate}
#nm-first-paint .nm-boot-center{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%;max-width:440px;transform:translateY(-2%);padding:24px;box-sizing:border-box}
#nm-first-paint .nm-boot-orbit{position:absolute;left:50%;top:39%;width:min(92vw,440px);height:170px;border:2px solid #f953b568;border-radius:50%;box-shadow:0 0 24px #f72e9659,inset 0 0 18px #b45cff33;transform:translate(-50%,-50%) rotate(-24deg);animation:nm-boot-orbit 8s linear infinite;pointer-events:none}
#nm-first-paint .nm-boot-orbit:after{content:"";position:absolute;top:13%;right:12%;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 9px 4px #ff60c5}
#nm-first-paint .nm-boot-orbit.second{width:min(77vw,350px);height:130px;border-color:#a56cff58;transform:translate(-50%,-50%) rotate(30deg);animation-duration:11s;animation-direction:reverse}
#nm-first-paint .nm-boot-logo-wrap{position:relative;width:146px;height:146px;z-index:1;filter:drop-shadow(0 0 26px #fa298c88);animation:nm-boot-float 3.5s ease-in-out infinite}
#nm-first-paint .nm-boot-logo-wrap:before{content:"";position:absolute;inset:-10px;border-radius:38px;background:linear-gradient(135deg,#ff8dc744,#8e53ff33);filter:blur(18px)}
#nm-first-paint .nm-boot-logo{position:relative;display:block;width:100%;height:100%;object-fit:contain;border-radius:32px;box-shadow:0 0 0 1px #ffffff3b,0 14px 44px #ed168078}
#nm-first-paint .nm-boot-sparkle{position:absolute;right:-21px;top:-14px;font-size:26px;color:#ffd0ef;text-shadow:0 0 16px #ff69d7;animation:nm-boot-twinkle 2s ease-in-out infinite}
#nm-first-paint .nm-boot-title{position:relative;margin:43px 0 0;font-family:Inter,Kanit,system-ui,sans-serif;font-weight:800;font-size:clamp(30px,8vw,46px);letter-spacing:.025em;line-height:1.2;white-space:nowrap;color:#fff;text-shadow:0 0 22px #ff66b844}
#nm-first-paint .nm-boot-title strong{font-weight:800;background:linear-gradient(105deg,#ff75af,#df92ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#nm-first-paint .nm-boot-tagline{margin:23px 0 0;color:#f2d4ed;font-size:clamp(15px,4.4vw,20px);font-weight:400;letter-spacing:.01em}
#nm-first-paint .nm-boot-track{position:relative;margin-top:47px;width:min(66vw,260px);height:6px;border:1px solid #f7b1e64d;border-radius:99px;background:#3d2348;overflow:visible;box-shadow:0 0 16px #ff43b124}
#nm-first-paint .nm-boot-progress{position:relative;display:block;width:42%;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff68ad,#f78bdf,#b877ff);box-shadow:0 0 13px #ff64be;animation:nm-boot-progress 1.6s ease-in-out infinite alternate}
#nm-first-paint .nm-boot-progress:after{content:"♥";position:absolute;right:-9px;top:50%;font-size:19px;color:#fff;line-height:1;transform:translateY(-50%);text-shadow:0 0 8px #fff,0 0 18px #ff5ec7}
#nm-first-paint .nm-boot-hearts{margin-top:23px;color:#ff82cc;font-size:13px;letter-spacing:10px;text-shadow:0 0 13px #ff56b3;animation:nm-boot-twinkle 2.1s ease-in-out infinite}
#nm-first-paint .nm-boot-particle{position:absolute;z-index:1;color:#ff8fd2;text-shadow:0 0 14px #ff48b6;pointer-events:none;animation:nm-boot-float 4s ease-in-out infinite}
#nm-first-paint .nm-boot-particle.p1{top:22%;left:13%;font-size:31px;animation-delay:-1s}
#nm-first-paint .nm-boot-particle.p2{top:31%;right:11%;font-size:23px;animation-delay:-2s}
#nm-first-paint .nm-boot-particle.p3{bottom:24%;left:17%;font-size:19px;animation-delay:-3s}
#nm-first-paint .nm-boot-particle.p4{bottom:29%;right:15%;font-size:27px;animation-delay:-.5s}
#nm-first-paint .nm-boot-particle.p5{top:15%;right:26%;font-size:16px;animation-delay:-2.5s}
#nm-first-paint.nm-boot-done{opacity:0;visibility:hidden;pointer-events:none}
@keyframes nm-boot-progress{from{transform:translateX(0)}to{transform:translateX(135%)}}
@keyframes nm-boot-twinkle{0%,100%{opacity:.4;transform:scale(.85)}50%{opacity:1;transform:scale(1.18)}}
@keyframes nm-boot-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
@keyframes nm-boot-orbit{from{transform:translate(-50%,-50%) rotate(-24deg)}to{transform:translate(-50%,-50%) rotate(336deg)}}
@keyframes nm-boot-ambient{from{opacity:.55;transform:scale(1)}to{opacity:1;transform:scale(1.1)}}
@media(prefers-reduced-motion:reduce){#nm-first-paint *,#nm-first-paint:before{animation:none!important}}
</style>

<body><div id="root"></div><div id="nm-first-paint" aria-hidden="true"><span class="nm-boot-particle p1">♡</span><span class="nm-boot-particle p2">♥</span><span class="nm-boot-particle p3">✦</span><span class="nm-boot-particle p4">♡</span><span class="nm-boot-particle p5">✧</span><div class="nm-boot-orbit"></div><div class="nm-boot-orbit second"></div><div class="nm-boot-center"><div class="nm-boot-logo-wrap"><img class="nm-boot-logo" src="/nisit-match-logo.png" alt="" /><span class="nm-boot-sparkle">✦</span></div><div class="nm-boot-title">NISIT <strong>MATCH</strong></div><p class="nm-boot-tagline">เจอคนใหม่ ๆ ที่เข้าใจกัน</p><div class="nm-boot-track"><span class="nm-boot-progress"></span></div><div class="nm-boot-hearts">♥ ♥ ♥</div></div></div><script type="module" src="/src/main.jsx"></script><script>(function(){var splash=document.getElementById("nm-first-paint"),root=document.getElementById("root");function finish(){if(root&&root.childElementCount>0){splash.classList.add("nm-boot-done");setTimeout(function(){splash.remove()},450)}else{var obs=new MutationObserver(function(){if(root.childElementCount>0){obs.disconnect();finish()}});obs.observe(root,{childList:true})}}setTimeout(finish,2000)})();</script></body>
